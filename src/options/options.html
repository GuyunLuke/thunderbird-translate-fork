<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-i18n="settingsTitle">Thunderbird Translate Fork Settings</title>
	<link rel="stylesheet" href="./options.css">
</head>

<body>
	<h1 data-i18n="settingsTitle">Thunderbird Translate Fork Settings</h1>
	<div class="lang-row">
		<label for="langSelect" data-i18n="language">Language</label>
		<select id="langSelect" class="lang-select">
			<option value="zh_CN">中文</option>
			<option value="en">English</option>
			<option value="fr">Français</option>
		</select>
	</div>
	<div class="lang-row">
		<label for="targetSelect" data-i18n="targetLanguage">Target language</label>
		<select id="targetSelect" class="lang-select">
			<option value="auto" data-i18n="targetAuto">Auto (follow UI language)</option>
			<option value="zh_CN">中文</option>
			<option value="en">English</option>
			<option value="fr">Français</option>
		</select>
	</div>
	<div id="data-notice" style="border:1px solid #ccc; padding:12px; background:#fffbe6; margin-bottom:12px;">
		<p><strong data-i18n="privacyNoticeTitle">Privacy notice:</strong> <span data-i18n="privacyNoticeBody">When you request a translation we send only the email message body to the translation provider you configured.</span></p>
	</div>
	<label for="apiModeSelect" data-i18n="apiProvider">API Provider</label>
	<select id="apiModeSelect">
		<option value="gemini" data-i18n="providerGemini">Google Gemini</option>
		<option value="deepseek" data-i18n="providerDeepSeek">DeepSeek</option>
		<option value="openai" data-i18n="providerOpenAI">OpenAI-compatible</option>
	</select>
	<label for="modelSelect" data-i18n="model">Model</label>
	<select id="modelSelect"></select>
	<div id="baseUrlRow" style="display:none;">
		<label for="baseUrlInput" data-i18n="baseUrl">Base URL (OpenAI-compatible)</label>
		<input type="text" id="baseUrlInput" placeholder="https://api.openai.com/v1" autocomplete="off">
		<p class="hint" data-i18n="baseUrlHint">Only enter the address of a service you trust.</p>
	</div>
	<label for="api-key" id="apiKeyLabel" data-i18n="apiKey">API Key</label>
	<input type="password" id="apiKeyInput" data-i18n-placeholder="apiKeyPlaceholder" placeholder="Enter your API key" required autocomplete="off">
	<button id="testButton" data-i18n="saveTest">Save &amp; Test</button>
	<p id="status" style="color: green;"></p>
	<script src="./options.js"></script>
</body>

</html>
