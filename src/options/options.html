<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>__MSG_settingsTitle__</title>
	<link rel="stylesheet" href="./options.css">
</head>

<body>
	<h1>__MSG_settingsTitle__</h1>
	<label for="apiModeSelect">__MSG_apiProvider__</label>
	<select id="apiModeSelect">
		<option value="gemini">__MSG_providerGemini__</option>
		<option value="deepseek">__MSG_providerDeepSeek__</option>
		<option value="openai">__MSG_providerOpenAI__</option>
	</select>
	<label for="modelInput">__MSG_model__</label>
	<input type="text" id="modelInput" list="modelList" autocomplete="off">
	<datalist id="modelList"></datalist>
	<div id="baseUrlRow" style="display:none;">
		<label for="baseUrlInput">__MSG_baseUrl__</label>
		<input type="text" id="baseUrlInput" placeholder="https://api.openai.com/v1" autocomplete="off">
	</div>
	<label for="api-key">__MSG_apiKey__</label>
	<input type="text" id="apiKeyInput" placeholder="__MSG_apiKeyPlaceholder__" required>
	<button id="testButton">__MSG_saveTest__</button>
	<p id="status" style="color: green;"></p>
	<div id="data-notice" style="border:1px solid #ccc; padding:12px; background:#fffbe6; margin-bottom:12px;">
		<p><strong>__MSG_privacyNoticeTitle__:</strong> __MSG_privacyNoticeBody__</p>
	</div>
	<script src="./options.js"></script>
</body>

</html>
